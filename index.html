<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/common/logo-cabanas.png" />
    <link rel="apple-touch-icon" href="/images/common/logo-cabanas.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload del hero de cabañas (home y /cabanas), única variante 1600px
         (misma imagen que usa el CSS en todos los anchos).
         No se precarga el hero de departamentos: no es LCP en esas rutas. -->
    <!-- /en/trek tiene su propio hero (CSS background, no descubrible en el HTML): se
         precarga ese en vez del de cabañas, que ahí no se usa y competía por ancho de banda.
         Script inline mínimo porque este HTML es el mismo para todas las rutas (SPA). -->
    <script>
      (function () {
        var trek = location.pathname.replace(/\/+$/, '') === '/en/trek';
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp';
        l.setAttribute('fetchpriority', 'high');
        l.href = trek ? '/images/common/torres-del-paine-trek-hero-1920.webp'
                      : '/images/common/hero_cabanasa_artebrisa-1600.webp';
        document.head.appendChild(l);
      })();
    </script>

    <title>Arte Brisa Patagonia — Cabañas y Departamentos en Puerto Natales</title>
    <!-- Los tags marcados data-rh son el fallback estático (crawlers sin JS); react-helmet-async
         los reemplaza en runtime por los de cada página/idioma (SeoHead), sin duplicarlos. -->
    <meta name="description" data-rh="true" content="Cabañas con vista a la cordillera y departamentos en el centro de Puerto Natales. Reserva tu estadía en la Patagonia con Arte Brisa." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" data-rh="true" content="https://artebrisapatagonia.com/" />
    <meta property="og:title" data-rh="true" content="Arte Brisa Patagonia — Cabañas y Departamentos en Puerto Natales" />
    <meta property="og:description" data-rh="true" content="Cabañas con vista a la cordillera y departamentos en el centro de Puerto Natales. Reserva tu estadía en la Patagonia con Arte Brisa." />
    <meta property="og:image" content="https://artebrisapatagonia.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://artebrisapatagonia.com/" />
    <meta name="twitter:title" data-rh="true" content="Arte Brisa Patagonia — Cabañas y Departamentos en Puerto Natales" />
    <meta name="twitter:description" data-rh="true" content="Cabañas con vista a la cordillera y departamentos en el centro de Puerto Natales. Reserva tu estadía en la Patagonia con Arte Brisa." />
    <meta name="twitter:image" content="https://artebrisapatagonia.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pesos de Inter realmente usados en el sitio (incluye /admin): 400/500/600/700/900.
         800 (extrabold) no se usa en ningún componente — se quitó de la URL.
         Carga no bloqueante: preload + swap a stylesheet en onload, con <noscript> de respaldo. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
